<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  
  <!-- Prevent browser from caching redirect results -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script>
    // ==========================================
    // ⚙️ CONFIGURE YOUR TWO LINKS HERE
    // ==========================================
    const LINK_1 = "https://mail.google.com";
    const LINK_2 = "https://drive.google.com";

    // Helper: auto-adds https:// if protocol is omitted
    const formatUrl = (url) => /^https?:\/\//i.test(url) ? url : `https://${url}`;

    // Randomly pick one (50/50 chance)
    const links = [LINK_1, LINK_2];
    const randomIndex = Math.floor(Math.random() * links.length);
    const destination = formatUrl(links[randomIndex]);

    // Redirect immediately before the full DOM renders
    window.location.replace(destination);
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      text-align: center;
      padding: 1.5rem;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
    }
    p {
      font-size: 0.95rem;
      color: #64748b;
      margin: 0 0 1rem 0;
    }
    a {
      color: #3b82f6;
      text-decoration: underline;
      font-weight: 500;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Redirecting you...</h2>
  <p>If you are not redirected automatically, <a id="manual-link" href="#">click here</a>.</p>

  <script>
    // In case automatic redirect is blocked or slow
    document.getElementById("manual-link").href = destination;
    document.getElementById("manual-link").innerText = `continue to ${destination}`;
  </script>
</body>
</html>
